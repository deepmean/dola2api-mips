# dola2api configuration, sourced by /etc/init.d/dola2api.
#
# This file is shell, not an env file: it is sourced, so quote values that
# contain spaces. Keep it mode 0600, because it holds API keys.

# ---------------------------------------------------------------------------
# Listener
# ---------------------------------------------------------------------------
DOLA_PORT=8790

# Comma-separated bearer tokens for /v1/*. With none set the API answers 503
# rather than serving anyone, which is deliberate: a service that opens up when
# it has not been configured will eventually be exposed by accident.
DOLA_API_KEYS=""

# Bearer token for /admin/*. Separate from the API keys, because whoever can
# reload accounts can point the service at a different session entirely.
DOLA_ADMIN_KEY=""

# ---------------------------------------------------------------------------
# Sessions
# ---------------------------------------------------------------------------
DOLA_ACCOUNTS_FILE=/opt/dola2api/accounts.json

# Videos per session per day. The upstream counts two.
DOLA_DAILY_LIMIT=2

# How long a session is parked after a failure, in seconds. Each consecutive
# failure multiplies this, up to 8x, so a broken session is not retried at the
# same rate forever.
DOLA_COOLDOWN_SEC=900

# Which session takes the next job: least-used | round-robin | random.
# least-used spreads a pool evenly; round-robin cycles in file order.
DOLA_ACCOUNT_STRATEGY=least-used

# How many sessions one task may try before it is reported as failed.
# A refusal parks the session that refused, so the retry moves to another one.
# Set 1 to disable failover.
DOLA_SUBMIT_ATTEMPTS=3

# The daily allowance resets at midnight in this zone. The router has no tzdata,
# so use a fixed offset rather than a zone name.
DOLA_LIMIT_RESET_TZ=+08:00

# Model identifiers GET /v1/models reports and POST /v1/videos accepts, comma
# separated. Overridable because the upstream's own identifier is not something
# this project can pin down from the outside: the web client builds its submit
# in a lazily loaded chunk, where the name is a display tag.
DOLA_VIDEO_MODELS="seedance_v2.0"

# The skill type for image generation. The upstream's own skill table reports 3
# as 圖片生成; the value the upstream Python used, 16, is SkillCodeAssistant and
# its branch had no callers. Configurable because this is evidence-based rather
# than confirmed end to end.
DOLA_IMAGE_ABILITY=3

# ---------------------------------------------------------------------------
# Text chat
# ---------------------------------------------------------------------------
# Chat does not go through the task queue: it needs no task record, no polling
# and no media store. With one worker and a 600s video timeout, a chat queued
# behind a video would look like a hang, so it has its own bound and deadline.
DOLA_CHAT_TIMEOUT=60
DOLA_CHAT_CONCURRENCY=2

# The wire value for a reasoning request. Uncertain: the upstream Python sends 1
# and a third-party client sends 3. Only used when a caller asks for it.
DOLA_DEEP_THINK_VALUE=1

# ---------------------------------------------------------------------------
# Egress
# ---------------------------------------------------------------------------
# relay | proxy | direct | none
#
# The upstream refuses mainland addresses outright, so direct is not usable from
# a router in mainland China.
DOLA_EGRESS=relay

# A Vercel Edge relay that reads x-relay-target and x-relay-path. A
# comma-separated list is allowed; set DOLA_EGRESS_ROTATE to use more than one.
DOLA_RELAY_URL="https://vcrelay.dmean.dpdns.org/"

# Optional shared secret sent to the relay as x-relay-key.
DOLA_RELAY_KEY=""

# 1 means a failing relay fails the request. Never set 0 unless you accept that
# the router's real address reaches the upstream: that is what it costs.
DOLA_STRICT_PROXY=1

# none | round-robin | random
DOLA_EGRESS_ROTATE=none

# Hosts that bypass the relay. The media CDNs belong here: the relay cannot
# fetch them usefully, and private addresses must never leave the machine.
DOLA_NO_PROXY="*.volces.com,*.byteimg.com,127.0.0.1,192.168.*"

# Seconds to wait for the first byte. The relay itself gives up at 25s.
DOLA_EGRESS_FIRST_BYTE_TIMEOUT=25

# ---------------------------------------------------------------------------
# Work
# ---------------------------------------------------------------------------
# protocol is the only implementation in this build.
DOLA_EXECUTOR=protocol

# One worker is the point: the router has 250MB of RAM and the upstream
# rate-limits anyway, so a second worker buys nothing and costs memory.
DOLA_MAX_CONCURRENCY=1

# Pending queue bound. A queue that grows without limit is a way to exhaust
# memory from the outside.
DOLA_MAX_PENDING_TASKS=4

# Seconds to wait for the generated video before giving up.
DOLA_VIDEO_TIMEOUT=600

# Seconds between polls while waiting.
DOLA_POLL_INTERVAL=10

# How long a finished task stays readable.
DOLA_TASK_TTL=30m

# ---------------------------------------------------------------------------
# Delivery
# ---------------------------------------------------------------------------
# redirect | pipe | mirror
#
# redirect hands the client the CDN URL: no bytes and no disk cross the router,
# and the CDN serves range requests. It is the default for a reason.
DOLA_STORE_MODE=redirect

# Only used by mirror mode. /tmp is tmpfs, so a mirror can never fill the
# overlay filesystem.
DOLA_MIRROR_DIR=/tmp/dola2api-mirror
DOLA_MIRROR_MAX_BYTES=67108864
DOLA_MIRROR_TTL_HOURS=6

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# The router's OOM killer does not know which process caused the pressure, so
# the service fails its own requests past this limit instead of being killed.
DOLA_HEAP_SOFT_LIMIT=33554432

# Bound inbound sockets so memory does not scale with open connections.
DOLA_MAX_CONNECTIONS=32
DOLA_MAX_HEADER_BYTES=16384

# Return freed memory to the kernel at task boundaries.
DOLA_FREE_OS_AFTER_JOB=1

GOMEMLIMIT=32MiB
GOGC=30
